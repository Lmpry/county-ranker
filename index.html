const LABEL={r:'Trump (R) votes',d:'Harris (D) votes',o:'Other votes',t:'Total votes',spread:'2024 spread (R% − D%)',margin:'Raw vote margin (R − D)',p:'Population (2024 est.)',rt:'Registered voters — total',rd:'Registered Democrats',rr:'Registered Republicans',ro:'Registered other/unaffiliated'};
let sortK='p',sortD='desc';let F={st:'',mn:null,mx:null,ro:false};
const $=id=>document.getElementById(id), fmt=n=>n==null?'<span class="na">N/A</span>':n.toLocaleString('en-US');
const states=[...new Set(ROWS.map(r=>r.s))].sort();
$('state').innerHTML='<option value="">Nationwide</option>'+states.map(s=>`<option>${s}</option>`).join('');
const PRESET={spreadR:['spread','desc','Spread — most Republican first'],spreadD:['spread','asc','Spread — most Democratic first'],close:['abs','asc','Spread — closest races first']};
LABEL.abs='Closeness (|R% − D%|)';
$('sortkey').innerHTML=Object.entries(LABEL).filter(([k])=>k!=='spread'&&k!=='abs').map(([k,v])=>`<option value="${k}">${v}</option>`).join('').replace('<option value="margin"',Object.entries(PRESET).map(([k,v])=>`<option value="${k}">${v[2]}</option>`).join('')+'<option value="margin"');
function parsePop(s){s=String(s).trim().toLowerCase().replace(/[\s,_]/g,'');if(s==='')return null;const m=s.match(/^(\d+(?:\.\d+)?)([km]?)$/);if(!m)return NaN;return Math.round(parseFloat(m[1])*(m[2]==='k'?1e3:m[2]==='m'?1e6:1))}
function sortDesc(){if(sortK==='spread')return sortD==='desc'?'most Republican first':'most Democratic first';if(sortK==='abs')return sortD==='asc'?'closest first':'least close first';return sortD==='desc'?'highest first':'lowest first'}
function spreadTxt(x){const v=x.spread;return `<span class="${v>=0?'r':'d'}">${v>=0?'R':'D'}+${Math.abs(v).toFixed(1)}</span>`}
function marginTxt(x){const v=x.margin;return `<span class="${v>=0?'r':'d'}">${v>=0?'R':'D'}+${Math.abs(v).toLocaleString('en-US')}</span>`}
function head(){
 const grp=[];COLS.forEach(c=>{const g=c.g||'';if(grp.length&&grp[grp.length-1].g===g)grp[grp.length-1].n++;else grp.push({g,n:1})});
 $('tbl').tHead.innerHTML='<tr>'+grp.map(x=>`<th class="grp" colspan="${x.n}">${x.g}</th>`).join('')+'</tr><tr>'+COLS.map(c=>{
  const a=c.k===sortK;return `<th data-k="${c.k}" class="${c.num?'num':''} ${c.sort?'sortable':''} ${a?'active':''}" ${c.sort?`title="Sort by ${LABEL[c.k]}"`:''}>${c.h}${a?`<span class="arr">${sortD==='desc'?'▼':'▲'}</span>`:''}</th>`}).join('')+'</tr>';
 $('tbl').tHead.querySelectorAll('th.sortable').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k===sortK)sortD=sortD==='desc'?'asc':'desc';else{sortK=k;sortD='desc'}sync();render()});
}
function sync(){$('sortkey').value=sortK==='spread'?(sortD==='desc'?'spreadR':'spreadD'):sortK==='abs'?'close':sortK;$('sortdir').value=sortD}
function render(){
 const {st,mn,mx,ro}=F;
 let f=ROWS.filter(x=>(!st||x.s===st)&&(mn==null||x.p>=mn)&&(mx==null||x.p<=mx)&&(!ro||x.rt!=null));
 const withVal=f.filter(x=>x[sortK]!=null),noVal=f.length-withVal.length;
 withVal.sort((a,b)=>sortD==='desc'?b[sortK]-a[sortK]:a[sortK]-b[sortK]);
 const top=withVal.slice(0,20);
 head();
 $('tbl').tBodies[0].innerHTML=top.length?top.map((x,i)=>`<tr><td class="num">${i+1}</td><td>${x.c}</td><td>${x.s}</td>
<td class="num">${fmt(x.r)}<span class="sub">${x.rp.toFixed(1)}%</span></td><td class="num">${fmt(x.d)}<span class="sub">${x.dp.toFixed(1)}%</span></td><td class="num">${x.o==null?fmt(null):fmt(x.o)+`<span class="sub">${(x.o/x.t*100).toFixed(1)}%</span>`}</td><td class="num">${fmt(x.t)}${x.tp?'<span class="sub">R+D only*</span>':''}</td>
<td class="num">${spreadTxt(x)}</td><td class="num">${marginTxt(x)}</td><td class="num">${fmt(x.p)}</td>
<td class="num">${fmt(x.rt)}</td><td class="num">${fmt(x.rd)}</td><td class="num">${fmt(x.rr)}</td><td class="num">${fmt(x.ro)}</td></tr>`).join(''):'<tr><td colspan="14" class="na" style="text-align:center;padding:24px">No counties match these filters.</td></tr>';
 const crit=[];if(mn!=null)crit.push(`population ≥ ${mn.toLocaleString('en-US')}`);if(mx!=null)crit.push(`population ≤ ${mx.toLocaleString('en-US')}`);if(ro)crit.push('with registration data');crit.push(st||'Nationwide');
 $('summary').innerHTML=`<b>${f.length.toLocaleString()} counties match: ${crit.join(', ')}</b> · showing top ${top.length} by ${LABEL[sortK]} (${sortDesc()})`+(noVal?` · ${noVal} matching counties have no ${LABEL[sortK].toLowerCase()} data and are excluded from this ranking`:'');
}
function search(){const mn=parsePop($('pmin').value),mx=parsePop($('pmax').value);
 if(Number.isNaN(mn)||Number.isNaN(mx)){$('err').textContent=' · Couldn\'t read the population '+(Number.isNaN(mn)?'min':'max')+' — use a number like 500,000, 500k or 1.2m';return}
 $('err').textContent='';if(mn!=null)$('pmin').value=mn.toLocaleString('en-US');if(mx!=null)$('pmax').value=mx.toLocaleString('en-US');
 F={st:$('state').value,mn,mx,ro:$('regonly').value==='1'};$('pending').textContent='';render();
 const s=$('summary');s.style.transition='none';s.style.background='#fff3c4';requestAnimationFrame(()=>{s.style.transition='background 1.2s';s.style.background='transparent'})}
$('search').onclick=search;
['pmin','pmax'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search()}}));
['state','pmin','pmax','regonly'].forEach(id=>$(id).addEventListener('input',()=>{$('pending').textContent=' · Filters changed — click Search to apply'}));
$('sortkey').onchange=()=>{const v=$('sortkey').value;if(PRESET[v]){sortK=PRESET[v][0];sortD=PRESET[v][1]}else{sortK=v;sortD='desc'}sync();render()};$('sortdir').onchange=()=>{sortD=$('sortdir').value;render()};
$('reset').onclick=()=>{$('state').value='';$('pmin').value='';$('pmax').value='';$('regonly').value='0';sortK='p';sortD='desc';sync();search()};
const M=DATA.meta,ms=Object.keys(M).sort();
$('notes').innerHTML=`<h3>Sources & notes</h3><ul>
<li><b>2024 presidential results:</b> tonmcg/US_County_Level_Election_Results_08-24 (2024 CSV, compiled from official county results). “Other” = total votes − Trump − Harris. Spread = R% − D% of total votes; margin = R votes − D votes.</li>
<li><b>Population:</b> U.S. Census Bureau Vintage 2024 county estimates (co-est2024-alldata.csv), July 1, 2024.</li>
<li><b>New York*</b>: the source CSV records only Trump + Harris votes for NY counties (no third-party totals), so NY “Other” is N/A and NY percentages/spread are two-party shares.</li>
<li><b>Alaska</b> is excluded: it reports presidential results by State House district, not by borough/census area, so they can’t be matched to county populations.</li>
<li><b>Connecticut</b> is shown by its 9 planning regions (the Census Bureau’s county-equivalents since 2022); both election results and population use these regions.</li>
<li><b>District of Columbia</b> results were reported by ward and are summed into one row.</li>
<li>Registration status differs by state (active-only vs active+inactive) and dates differ — compare across states with care. Counties with no data show N/A and are skipped when ranking by a registration column.</li></ul>
<h3>Voter registration by state (${ms.length} states)</h3><table><tr><th>State</th><th>Source</th><th>As of</th><th>Notes</th></tr>${ms.map(s=>`<tr><td>${s}</td><td><a href="${M[s][3]}" target="_blank" rel="noopener">${M[s][0]}</a></td><td>${M[s][1]}</td><td>${M[s][2]}</td></tr>`).join('')}</table>
<p>All other states: registration shown as N/A (not collected in this build; several states such as TX, GA, MI, WI, OH, VA have no party registration).</p>`;
sync();render();
</script></body></html>
